name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Checks the workspace and packs the libraries, once. Every consumer job below
  # installs the tarballs this job produces, outside the workspace.
  packages:
    name: Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads `packageManager` from package.json (pnpm 9.8.0).
      - uses: pnpm/action-setup@v6

      # 24 is the LTS that satisfies vitest's `^22.12.0 || ^24.0.0 || >=26.0.0`.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack the libraries
        run: node tools/verify-install.mjs --pack-only .verify/tarballs

      - name: Upload the tarballs
        uses: actions/upload-artifact@v5
        with:
          name: soundline-tarballs
          path: .verify/tarballs/*.tgz
          retention-days: 7

  # One environment per job, each with its own npm cache: a consumer's tree is not
  # the workspace's, and no leg may see another's. The legs and their pinned
  # versions come from the templates in `tools/install-check/`.
  consumer:
    name: ${{ matrix.leg }}
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg:
          - react-18
          - react-19
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v6
        with:
          name: soundline-tarballs
          path: .verify/tarballs

      # The key names the template (the leg), the Node version and the lockfile, so
      # a leg never restores another leg's cache.
      - name: Restore the ${{ matrix.leg }} npm cache
        uses: actions/cache@v4
        with:
          path: .verify/${{ matrix.leg }}/npm-cache
          key: npm-${{ runner.os }}-node24-${{ matrix.leg }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            npm-${{ runner.os }}-node24-${{ matrix.leg }}-

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The script needs no workspace install: it reads the manifests, builds the
      # scratch copy, runs that leg's production build, hydrates it in jsdom, and
      # finally hydrates the prerendered page in the runner's Chrome (already
      # present, as in the browser checks below).
      - name: Verify ${{ matrix.leg }}
        run: node tools/verify-install.mjs --leg ${{ matrix.leg }} --tarballs .verify/tarballs

  # The playground and the browser-level checks that need a real layout engine.
  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the packages
        run: pnpm build

      - name: Build the playground
        run: pnpm --filter @nickkupriyanov/soundline-playground build

      # jsdom has no layout engine, so the width invariants, the container
      # adaptation, focus visibility and reduced motion are measured in a real
      # browser. The runner ships Chrome at /usr/bin/google-chrome, which
      # tools/screenshot.mjs already looks for.
      - name: Browser checks (real Chrome)
        run: |
          pnpm --filter @nickkupriyanov/soundline-playground preview --port 4173 --strictPort &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4173/gallery.html && break
            sleep 1
          done
          node tools/check-layout.mjs
          node tools/check-container.mjs

      - name: Build Storybook
        run: pnpm build-storybook
